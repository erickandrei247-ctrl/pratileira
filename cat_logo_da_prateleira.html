    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Fundo suave */
        }
        
        /* Efeito de hover suave nos cartões */
        .book-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        
        /* Simulação de sombra de prateleira abaixo dos títulos das seções */
        .shelf-divider {
            height: 4px;
            background: linear-gradient(to bottom, #cbd5e1 0%, #f8fafc 100%);
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }
    </style>

                </div>

        // Função utilitária para definir a cor e ícone do badge de status
        function getStatusStyles(status) {
            switch(status.toLowerCase()) {
                case 'lido':
                    return {
                        bg: 'bg-emerald-100', text: 'text-emerald-800', border: 'border-emerald-200', icon: 'fa-check-circle'
                    };
                case 'lendo':
                    return {
                        bg: 'bg-indigo-100', text: 'text-indigo-800', border: 'border-indigo-200', icon: 'fa-book-open-reader'
                    };
                case 'emprestado':
                    return {
                        bg: 'bg-amber-100', text: 'text-amber-800', border: 'border-amber-200', icon: 'fa-hand-holding-hand'
                    };
                default:
                    return {
                        bg: 'bg-slate-100', text: 'text-slate-800', border: 'border-slate-200', icon: 'fa-bookmark'
                    };
            }
        }

        // Função principal para renderizar o catálogo
        function renderCatalog() {
            const container = document.getElementById('catalog-container');
            container.innerHTML = ''; // Limpa o container

            // Atualiza o contador de livros no cabeçalho
            const totalBooksEl = document.getElementById('total-books-counter');
            if(totalBooksEl) totalBooksEl.innerHTML = `<i class="fa-solid fa-layer-group mr-1 text-slate-400"></i> ${libraryData.length} Livros`;

            // Agrupa os livros por categoria
            const categories = [...new Set(libraryData.map(book => book.category))];

            categories.forEach(category => {
                // Filtra os livros que pertencem a esta categoria
                const categoryBooks = libraryData.filter(book => book.category === category);

                // Cria o HTML da Seção (Prateleira)
                const sectionHtml = `
                    <section class="book-category">
                        <div class="mb-4 flex items-baseline gap-3">
                            <h2 class="text-xl sm:text-2xl font-bold text-slate-800">${category}</h2>
                            <span class="text-xs font-medium bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">${categoryBooks.length}</span>
                        </div>
                        <div class="shelf-divider"></div>
                        
                        <!-- Grid de Cartões -->
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
                            ${categoryBooks.map(book => {
                                const statusStyle = getStatusStyles(book.status);
                                
                                return `
                                    <div class="book-card bg-white rounded-xl shadow-sm border border-slate-100 flex flex-col h-full overflow-hidden">
                                        <!-- Capa -->
                                        <div class="relative pt-[150%] sm:pt-[140%] w-full bg-slate-100">
                                            <img 
                                                src="${book.cover}" 
                                                alt="Capa do livro ${book.title}"
                                                class="absolute inset-0 w-full h-full object-cover shadow-inner"
                                                loading="lazy"
                                                onerror="this.src='https://placehold.co/300x450/e2e8f0/64748b?text=Sem+Capa'"
                                            >
                                        </div>
                                        
                                        <!-- Informações do Livro -->
                                        <div class="p-3 sm:p-4 flex flex-col flex-grow">
                                            <h3 class="font-bold text-sm sm:text-base text-slate-900 leading-snug mb-1 line-clamp-2" title="${book.title}">
                                                ${book.title}
                                            </h3>
                                            <p class="text-xs sm:text-sm text-slate-500 mb-3 line-clamp-1" title="${book.author}">
                                                ${book.author}
                                            </p>
                                            
                                            <!-- Status -->
                                            <div class="mt-auto">
                                                <span class="inline-flex items-center gap-1.5 px-2 py-1 rounded-md text-[10px] sm:text-xs font-semibold uppercase tracking-wider border ${statusStyle.bg} ${statusStyle.text} ${statusStyle.border}">
                                                    <i class="fa-solid ${statusStyle.icon}"></i>
                                                    ${book.status}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </section>
                `;

                // Injeta a seção no container
                container.insertAdjacentHTML('beforeend', sectionHtml);
            });
        }

        // Inicializa o app quando a página carregar
        window.addEventListener('DOMContentLoaded', renderCatalog);
    </script>
</body>
</html>
